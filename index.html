<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SimpleRadar" />
  <title>SimpleRadar</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="map"></div>
  <header class="top-bar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" type="search" placeholder="Search a city" enterkeyhint="search" autocomplete="off" />
    </div>
    <button class="icon-btn" id="locateBtn" title="Use my location" aria-label="Use my location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        <circle cx="12" cy="12" r="8"/>
      </svg>
    </button>
  </header>
  <div id="results" class="results"></div>
  <div id="alerts" class="alert-banner"></div>
  <section class="sheet">
    <div class="handle"></div>
    <div class="now">
      <div class="wx-icon" id="wxIcon">☁️</div>
      <div class="now-meta">
        <h2 id="placeName">Hoover, Alabama</h2>
        <p id="condition">Loading current conditions…</p>
      </div>
      <div class="now-temp" id="temp">--<span>°</span></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="feels">--</b><span>Feels like</span></div>
      <div class="stat"><b id="wind">--</b><span>Wind</span></div>
      <div class="stat"><b id="rain">--</b><span>Rain chance</span></div>
    </div>
    <div class="forecast" id="forecast"></div>
    <div class="range-row">
      <span class="range-label">Radar loop</span>
      <div class="pills" role="tablist" aria-label="Radar duration">
        <button type="button" class="pill" id="range2h" data-range="2">2 hr</button>
        <button type="button" class="pill active" id="range24h" data-range="24">24 hr</button>
      </div>
    </div>
    <div class="radar-controls">
      <button class="play" id="playBtn" aria-label="Play radar">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <input class="slider" id="slider" type="range" min="0" max="0" value="0" />
      <div class="time-label">
        <b id="frameTime">Radar</b>
        <span id="frameHint">last 24 hours</span>
      </div>
    </div>
    <p class="hint">24-hr radar: Iowa State NEXRAD · 2-hr: RainViewer · Forecast: Open-Meteo</p>
  </section>
  <div id="toast" class="toast"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
